name: Create Release

on:
  push:
    branches:
      - main
    tags:
      - 'build#*.*.*'

env:
  PREFIX_REGEX: 'build#(.*)'
  IS_PRERELEASE: ${{ !startsWith(github.ref, 'refs/tags/build#') || contains(github.ref, '-') }}

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          disable-file-monitoring: true   # package.json is being updated as part of the build process
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Check out source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get current tag
        id: get-tag
        uses: devops-actions/action-get-tag@7121a0d02be4cc926d0866b83de2a62688199687 # v1.0.4
        with:
          strip_v: false

      - name: Get the new version
        # Remove the prefix
        id: get-version
        run: |
          rctag=${{ steps.get-tag.outputs.tag }}
          re='${{ env.PREFIX_REGEX }}'
          if [[ $rctag =~ $re ]]; then
            echo "::debug::Tag matches regex pattern"
            rctag=${BASH_REMATCH[1]}
          else
            echo "::debug::Tag DOES NOT match regex pattern"
          fi
          echo "version=$rctag" >> "$GITHUB_OUTPUT"

      - name: Update package version to ${{ steps.get-version.outputs.version }}
        # Allowing npm to commit the changes isn't ideal; we want to commit both updated
        # package.json files together, but npm only commits the files changed by the
        # individual command, so we'd end up with 2 separate commits.  Also, it tags the
        # commit with the version number prefixed with "v", which is not wanted.
        run: |
          npm version ${{ steps.get-version.outputs.version }} --no-git-tag-version
          cd ./projects/log4ngx
          npm version ${{ steps.get-version.outputs.version }} --no-git-tag-version
          cd ../..

      - name: Commit updated package
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: NPM package version updated to ${{ steps.get-version.outputs.version }}
          branch: main
          commit_user_name: ${{ github.actor }}
          commit_user_email: ${{ github.actor }}@users.noreply.github.com

      - name: Remove original git tag
        # This deletes the original prefixed tag on the remote (origin) repo but
        # obviously doesn't remove it from any local repos that created/pulled
        # the tag beforehand.  That shouldn't be an issue though, as we're only
        # tidying it up because it's redundant.
        run: |
          git tag -d ${{ steps.get-tag.outputs.tag }}
          git push origin :refs/tags/${{ steps.get-tag.outputs.tag }}

      - name: Create draft Github pre-release for ${{ steps.get-version.outputs.version }} (${{ env.IS_PRERELEASE }})
        if: env.IS_PRERELEASE == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: ${{ steps.get-version.outputs.version }}
          tag_name: ${{ steps.get-version.outputs.version }}
          prerelease: true
          draft: true

      - name: Create draft Github release for ${{ steps.get-version.outputs.version }} (!${{ env.IS_PRERELEASE }})
        if: env.IS_PRERELEASE == 'false'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: ${{ steps.get-version.outputs.version }}
          tag_name: ${{ steps.get-version.outputs.version }}
          prerelease: false
          draft: true
